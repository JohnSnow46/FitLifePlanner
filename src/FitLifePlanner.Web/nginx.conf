server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM SPA fallback: any unmatched path serves index.html so
    # client-side routing (NavigationManager) works on hard refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
