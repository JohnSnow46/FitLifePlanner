services:
  api:
    build:
      context: .
      dockerfile: src/FitLifePlanner.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Redirect the SQLite file (appsettings.json default: "Data Source=fitlifeplanner.db",
      # relative to the container's working dir) onto the named volume below so it
      # survives container restarts/recreation.
      - ConnectionStrings__Default=Data Source=/app/data/fitlifeplanner.db
      # appsettings.json has no default for Jwt:Key (locally it only ever comes from
      # `dotnet user-secrets`) — TokenService.GenerateToken/Program.cs read it with no
      # fallback, so without this the container throws on every register/login call.
      # Set JWT_KEY in a local .env file (see .env.example) — never hardcode it here.
      - Jwt__Key=${JWT_KEY:?JWT_KEY must be set in .env, see .env.example}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/FitLifePlanner.Web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    # Web/wwwroot/appsettings.Production.json overrides ApiBaseUrl to
    # http://localhost:8080/ (the api service's host-mapped port above) when the
    # app is served by a plain static server (no ASP.NET Core dev-server env
    # header), which is what happens in this nginx-based container — standard
    # Blazor WASM hosted-environment detection, defaults to Production outside
    # a dev server. Api/appsettings.json's Cors:AllowedOrigins includes this web
    # service's host-mapped port (8081) to match.

volumes:
  api-data:
